<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .messages-grid {
            display: grid;
            gap: 20px;
        }

        .message-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .message-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }

        .message-info h3 {
            color: #333;
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .message-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .message-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-replied {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .message-content {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            color: #333;
            line-height: 1.6;
        }

        .reply-section {
            margin-top: 16px;
        }

        .reply-content {
            background: #e7f3ff;
            padding: 16px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            color: #333;
            margin-bottom: 12px;
        }

        .reply-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reply-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.2s;
        }

        .reply-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .reply-form button {
            align-self: flex-end;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .reply-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .reply-form button:active {
            transform: translateY(0);
        }

        .timestamp {
            color: #999;
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 60px 20px;
        }

        .empty-state h2 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📬 Contact Messages</h1>
        <div id="error-container"></div>
        <div id="messages-container" class="messages-grid">
            <div class="loading">Loading messages...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3002';

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/contacts`);
                if (!response.ok) throw new Error('Failed to fetch messages');
                
                const messages = await response.json();
                displayMessages(messages);
            } catch (error) {
                showError('Failed to load messages. Make sure the backend is running on port 3002.');
                console.error(error);
            }
        }

        function displayMessages(messages) {
            const container = document.getElementById('messages-container');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No messages yet</h2>
                        <p>Messages from your portfolio will appear here</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = messages.map(msg => `
                <div class="message-card">
                    <div class="message-header">
                        <div class="message-info">
                            <h3>${escapeHtml(msg.name)}</h3>
                            <p>${escapeHtml(msg.email)}</p>
                        </div>
                        <span class="message-status ${msg.isReplied ? 'status-replied' : 'status-pending'}">
                            ${msg.isReplied ? '✓ Replied' : '⏳ Pending'}
                        </span>
                    </div>
                    
                    <div class="message-content">
                        ${escapeHtml(msg.message)}
                    </div>
                    
                    <div class="timestamp">
                        Received: ${new Date(msg.createdAt).toLocaleString()}
                    </div>
                    
                    <div class="reply-section">
                        ${msg.isReplied ? `
                            <div class="reply-content">
                                <strong>Your Reply:</strong><br>
                                ${escapeHtml(msg.reply)}
                            </div>
                            <div class="timestamp">
                                Replied: ${new Date(msg.updatedAt).toLocaleString()}
                            </div>
                        ` : `
                            <form class="reply-form" onsubmit="sendReply(event, ${msg.id})">
                                <textarea 
                                    id="reply-${msg.id}" 
                                    placeholder="Type your reply here..."
                                    required
                                ></textarea>
                                <button type="submit">Send Reply</button>
                            </form>
                        `}
                    </div>
                </div>
            `).join('');
        }

        async function sendReply(event, messageId) {
            event.preventDefault();
            
            const textarea = document.getElementById(`reply-${messageId}`);
            const reply = textarea.value.trim();
            
            if (!reply) return;
            
            try {
                const response = await fetch(`${API_URL}/contacts/${messageId}/reply`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ reply }),
                });
                
                if (!response.ok) throw new Error('Failed to send reply');
                
                // Reload messages to show the updated state
                await loadMessages();
            } catch (error) {
                showError('Failed to send reply. Please try again.');
                console.error(error);
            }
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load messages on page load
        loadMessages();

        // Refresh every 30 seconds
        setInterval(loadMessages, 30000);
    </script>
</body>
</html>
